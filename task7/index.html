<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента постов</title>
  <link rel="stylesheet" href="style.css">
 <script src="js/cfg.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/search.js" defer></script>
<script src="js/script.js" defer></script>
</head>
<body>
  <header class="header">
    <h1 class="header__title">Лента постов</h1>
    <input
      type="search"
      id="search"
      class="search"
      placeholder="Поиск по заголовку…"
      autocomplete="off"
    >
  </header>

  <main class="main">
    <section id="posts" class="posts"></section>

    <p id="empty" class="notice" hidden>Ничего не найдено</p>
    <p id="loader" class="loader" hidden><span class="loader__spinner"></span>Загрузка…</p>

    <div id="error" class="error" hidden>
      <p id="error-text" class="error__text"></p>
      <button id="retry-btn" class="btn" type="button">Повторить</button>
    </div>

    <p id="end" class="notice" hidden>Больше постов нет</p>
  </main>
</body>
</html>
